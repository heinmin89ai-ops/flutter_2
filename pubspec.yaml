name: pharmacy_pos
description: "Offline-first Mobile Pharmacy Management System (Retail & Wholesale)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3

  # Local database (offline-first)
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # Secure key/value for license + session
  flutter_secure_storage: ^11.2.0

  # Routing
  go_router: ^18.0.1

  # Hashing primitives (PBKDF2 built on Hmac)
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

  # Only the schema-migration test uses this directly, to build a real on-disk
  # Phase 1 database before drift ever opens it. Declared rather than relied on
  # transitively through drift/native, which the analyzer rightly complains about.
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
